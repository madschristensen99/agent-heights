<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Character Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; overflow: hidden; }
    #app { display: flex; height: 100vh; }
    #canvas-wrap { flex: 1; position: relative; }
    #canvas-wrap canvas { display: block; width: 100%; height: 100%; }
    #controls {
      width: 320px; padding: 16px; overflow-y: auto;
      background: #16213e; border-left: 1px solid #0f3460;
    }
    #controls h1 { font-size: 18px; margin-bottom: 12px; color: #e94560; }
    .control-group { margin-bottom: 12px; }
    .control-group label { display: block; font-size: 12px; color: #8a8a96; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .control-row { display: flex; align-items: center; gap: 8px; }
    .control-row button {
      background: #0f3460; border: none; color: #e0e0e0; width: 28px; height: 28px;
      border-radius: 4px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    }
    .control-row button:hover { background: #1a4a7a; }
    .control-row .value { flex: 1; text-align: center; font-size: 13px; }
    #randomize {
      width: 100%; padding: 10px; margin-top: 8px;
      background: #e94560; border: none; color: white; border-radius: 6px;
      cursor: pointer; font-size: 14px; font-weight: 600;
    }
    #randomize:hover { background: #ff5a7a; }
    #info { margin-top: 16px; font-size: 11px; color: #555; line-height: 1.5; }
    #toggle-rotate {
      width: 100%; padding: 8px; margin-top: 8px;
      background: #0f3460; border: 1px solid #1a4a7a; color: #e0e0e0; border-radius: 6px;
      cursor: pointer; font-size: 12px;
    }
    #toggle-rotate:hover { background: #1a4a7a; }
    #toggle-rotate.active { background: #1a4a7a; color: #e94560; }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-wrap"></div>
    <div id="controls">
      <h1>Voxel Character Preview</h1>
      <div id="controls-body"></div>
      <button id="toggle-rotate" class="active">Auto-Rotate: ON</button>
      <button id="randomize">Randomize</button>
      <div id="info">
        Drag to rotate. Scroll to zoom.<br>
        This renders the same CharPalette data as a 3D voxel model.
      </div>
    </div>
  </div>
  <script type="module" src="/src/voxel-preview.ts"></script>
</body>
</html>
